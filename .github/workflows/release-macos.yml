name: Build JodSub macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.1"
        required: true
        default: "0.1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller numpy soundfile
      - name: Build app
        run: pyinstaller --noconfirm --clean build_jodsub.spec
      - name: Package ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/JodSub.app "JodSub-${{ inputs.version }}.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: JodSub v${{ inputs.version }}
          generate_release_notes: true
          files: JodSub-${{ inputs.version }}.zip
